# SoC Pulse scanner
# Runs hourly on GitHub's servers: tests the query engine, scans public sources,
# and commits data/mentions.json + data/pool.json, which the dashboard reads.
# Active sources need no accounts: NUSWhispers, Hacker News, HardwareZone (RSS).
# Reddit and Bluesky are disabled in config/monitors.json; see SETUP.md.

name: SoC Pulse scan

on:
  schedule:
    - cron: '17 * * * *'   # hourly at :17 (offset avoids GitHub's on-the-hour congestion)
  workflow_dispatch:        # manual "Run workflow" from the Actions tab
  push:
    paths:                  # re-run when monitors or the engine change, so tags update right away
      - 'config/monitors.json'
      - 'engine/**'
      - 'connectors/**'

permissions:
  contents: write

concurrency:
  group: soc-pulse-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test query engine and monitors
        run: node --test test/*.test.mjs

      - name: Run scanner
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: node scan.mjs

      - name: Commit results
        run: |
          git config user.name "soc-pulse-bot"
          git config user.email "actions@github.com"
          git add data/mentions.json data/pool.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Scheduled scan: update mentions data"
            git pull --rebase --autostash
            git push
          fi
